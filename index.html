<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fern</title>

    <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/f2/6b/da/f26bda09b95406861725319afa92d2d4.jpg">
    <meta property="og:title" content="fern">
    <meta property="og:image" content="https://i.pinimg.com/736x/f2/6b/da/f26bda09b95406861725319afa92d2d4.jpg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="fern">
    <meta name="twitter:image" content="https://i.pinimg.com/736x/f2/6b/da/f26bda09b95406861725319afa92d2d4.jpg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        .star-small  { width: 1px; height: 1px; box-shadow: 0 0 2px #fff; }
        .star-medium { width: 2px; height: 2px; box-shadow: 0 0 3px #fff; }
        .star-large  { width: 3px; height: 3px; box-shadow: 0 0 4px #fff; }
        @keyframes twinkle {
            0%, 100% { opacity: .3; transform: scale(.8); }
            50%      { opacity: 1;  transform: scale(1.2); }
        }

        .particle {
            position: fixed;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            box-shadow: 0 0 2px #fff;
            z-index: 0;
        }
        .particle-small  { width: 1px; height: 1px; animation: floatSmall 12s ease-in-out infinite; }
        .particle-medium { width: 2px; height: 2px; animation: floatMedium 15s ease-in-out infinite; }
        .particle-large  { width: 3px; height: 3px; animation: floatLarge 18s ease-in-out infinite; }
        @keyframes floatSmall {
            0%   { transform: translateY(100vh) translateX(0) rotate(0);      opacity: 0; }
            10%, 90% { opacity: .4; }
            100% { transform: translateY(-100vh) translateX(40px) rotate(360deg); opacity: 0; }
        }
        @keyframes floatMedium {
            0%   { transform: translateY(100vh) translateX(0) rotate(0);      opacity: 0; }
            10%, 90% { opacity: .3; }
            100% { transform: translateY(-100vh) translateX(-40px) rotate(-360deg); opacity: 0; }
        }
        @keyframes floatLarge {
            0%   { transform: translateY(100vh) translateX(0) rotate(0);      opacity: 0; }
            10%, 90% { opacity: .2; }
            100% { transform: translateY(-100vh) translateX(60px) rotate(360deg); opacity: 0; }
        }

        .hidden { display: none !important; }

        .glow {
            font-size: 3rem;
            font-weight: normal;
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
            text-transform: lowercase;
        }
        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 5px #fff, 0 0 10px #fff; }
            50%      { text-shadow: 0 0 3px #fff, 0 0 6px #fff; }
        }

        /* ---------- auth screen ---------- */
        #authScreen {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-box {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .auth-box .glow { margin-bottom: 8px; }
        .auth-box .tagline {
            color: #fff;
            opacity: .55;
            font-size: .8rem;
            letter-spacing: 2px;
            text-transform: lowercase;
            margin-bottom: 34px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }
        .tabs button {
            flex: 1;
            padding: 10px 0;
            background: transparent;
            border: 1px solid rgba(255,255,255,.18);
            color: rgba(255,255,255,.55);
            font-size: .75rem;
            letter-spacing: 2px;
            text-transform: lowercase;
            cursor: pointer;
            border-radius: 6px;
            transition: all .2s;
            font-family: inherit;
        }
        .tabs button.active {
            color: #fff;
            border-color: #fff;
            text-shadow: 0 0 6px #fff;
            box-shadow: 0 0 12px rgba(255,255,255,.15);
        }
        .tabs button:hover { color: #fff; }

        .field {
            width: 100%;
            padding: 13px 14px;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.12);
            color: #fff;
            font-size: .85rem;
            letter-spacing: .5px;
            border-radius: 6px;
            outline: none;
            margin-bottom: 10px;
            transition: all .2s;
            font-family: inherit;
        }
        .field::placeholder { color: rgba(255,255,255,.3); }
        .field:focus {
            border-color: rgba(255,255,255,.7);
            box-shadow: 0 0 12px rgba(255,255,255,.15);
            background: rgba(255,255,255,.05);
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            font-size: .8rem;
            letter-spacing: 3px;
            text-transform: lowercase;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 8px;
            transition: all .2s;
            text-shadow: 0 0 5px #fff;
            box-shadow: 0 0 10px rgba(255,255,255,.1);
            font-family: inherit;
        }
        .btn:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(255,255,255,.3), 0 0 40px rgba(255,255,255,.1);
            text-shadow: 0 0 10px #fff;
        }
        .btn:active:not(:disabled) { transform: scale(.98); }
        .btn:disabled { opacity: .35; cursor: not-allowed; }

        .msg {
            margin-top: 16px;
            font-size: .75rem;
            letter-spacing: 1px;
            min-height: 16px;
            text-transform: lowercase;
        }
        .msg.err { color: #ff6b6b; text-shadow: 0 0 6px rgba(255,107,107,.5); }
        .msg.ok  { color: #5cff9d; text-shadow: 0 0 6px rgba(92,255,157,.5); }

        .footer-link {
            display: block;
            margin-top: 28px;
            color: rgba(255,255,255,.3);
            font-size: .7rem;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-decoration: none;
            transition: color .2s;
        }
        .footer-link:hover { color: #fff; }

        /* ---------- dashboard ---------- */
        #dashScreen {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }
        .dash-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 10px;
        }
        .dash-head .glow { font-size: 2rem; }
        .dash-head-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .who {
            font-size: .75rem;
            letter-spacing: 1.5px;
            text-transform: lowercase;
            color: rgba(255,255,255,.5);
        }
        .who b { color: #fff; text-shadow: 0 0 5px #fff; font-weight: normal; }
        .logout {
            background: transparent;
            border: 1px solid rgba(255,255,255,.2);
            color: rgba(255,255,255,.6);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: .7rem;
            letter-spacing: 2px;
            text-transform: lowercase;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
        }
        .logout:hover {
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 12px rgba(255,255,255,.15);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
            margin: 26px 0;
        }
        .section-title {
            font-size: .7rem;
            letter-spacing: 3px;
            text-transform: lowercase;
            color: rgba(255,255,255,.45);
            margin-bottom: 16px;
        }

        .grid { display: grid; gap: 12px; }
        .g4 { grid-template-columns: repeat(4, 1fr); }
        @media (max-width: 820px) { .g4 { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 420px) { .g4 { grid-template-columns: 1fr; } }

        .stat {
            background: rgba(255,255,255,.02);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px;
            padding: 18px 20px;
            transition: all .3s;
        }
        .stat:hover {
            border-color: rgba(255,255,255,.3);
            box-shadow: 0 0 20px rgba(255,255,255,.05);
            background: rgba(255,255,255,.035);
        }
        .stat .label {
            font-size: .65rem;
            letter-spacing: 2px;
            text-transform: lowercase;
            color: rgba(255,255,255,.4);
            margin-bottom: 8px;
        }
        .stat .value {
            font-size: 1.9rem;
            font-weight: normal;
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,.4);
            letter-spacing: 1px;
        }
        .stat .value.small { font-size: 1rem; }

        .panel {
            background: rgba(255,255,255,.02);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px;
            padding: 4px 22px;
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid rgba(255,255,255,.07);
            font-size: .8rem;
        }
        tr:last-child td { border-bottom: none; }
        th {
            font-size: .65rem;
            letter-spacing: 2px;
            text-transform: lowercase;
            color: rgba(255,255,255,.4);
            font-weight: normal;
        }
        td.muted { color: rgba(255,255,255,.4); font-size: .72rem; }
        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: .65rem;
            letter-spacing: 1.5px;
            text-transform: lowercase;
            border: 1px solid rgba(255,255,255,.25);
            color: rgba(255,255,255,.8);
        }
        .tag.nuke { color: #ff6b6b; border-color: rgba(255,107,107,.4); text-shadow: 0 0 5px rgba(255,107,107,.5); }
        .tag.pm   { color: #6bd6ff; border-color: rgba(107,214,255,.4); text-shadow: 0 0 5px rgba(107,214,255,.5); }
        .empty { text-align: center; color: rgba(255,255,255,.3); padding: 40px 0; font-size: .8rem; letter-spacing: 1px; }

        @media (max-width: 600px) {
            .glow { font-size: 2rem; letter-spacing: 1px; }
            .dash-head .glow { font-size: 1.6rem; }
            .stat .value { font-size: 1.5rem; }
            th, td { font-size: .75rem; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <!-- LOGIN -->
    <div id="authScreen">
        <div class="auth-box">
            <div class="glow">fern</div>
            <div class="tagline">private dashboard</div>

            <div class="tabs">
                <button id="tabLogin"    class="active" onclick="setMode('login')">login</button>
                <button id="tabRegister"               onclick="setMode('register')">register</button>
            </div>

            <form id="authForm" onsubmit="submitAuth(event)">
                <input id="ident" class="field" placeholder="username or email" autocomplete="username" required>
                <input id="password" class="field" placeholder="password" type="password" autocomplete="current-password" required>
                <button class="btn" id="authBtn" type="submit">enter</button>
            </form>

            <div id="authMsg" class="msg"></div>
            
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashScreen" class="hidden">
        <div class="dash-head">
            <div class="glow">fern</div>
            <div class="dash-head-right">
                <div class="who">signed in as <b id="whoName">—</b></div>
                <button class="logout" onclick="logout()">logout</button>
            </div>
        </div>

        <div class="divider"></div>

        <div class="section-title">stats</div>
        <div class="grid g4">
            <div class="stat"><div class="label">servers nuked</div>    <div class="value" id="stSrv">0</div></div>
            <div class="stat"><div class="label">channels deleted</div> <div class="value" id="stDel">0</div></div>
            <div class="stat"><div class="label">channels made</div>    <div class="value" id="stMade">0</div></div>
            <div class="stat"><div class="label">messages sent</div>    <div class="value" id="stMsgs">0</div></div>
        </div>
        <div class="grid g4" style="margin-top:12px">
            <div class="stat"><div class="label">webhooks made</div> <div class="value" id="stWh">0</div></div>
            <div class="stat"><div class="label">members dmed</div>  <div class="value" id="stDm">0</div></div>
            <div class="stat"><div class="label">last update</div>   <div class="value small" id="stUp">—</div></div>
            <div class="stat"><div class="label">history rows</div>  <div class="value" id="stHist">0</div></div>
        </div>

        <div class="divider"></div>

        <div class="section-title">recent history</div>
        <div class="panel">
            <table>
                <thead>
                    <tr><th>when</th><th>action</th><th>server</th><th>details</th></tr>
                </thead>
                <tbody id="historyBody">
                    <tr><td colspan="4" class="empty">loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        /* ---------- stars & particles ---------- */
        (function buildStars() {
            const starsContainer = document.getElementById('stars');
            const starSizes = ['star-small', 'star-medium', 'star-large'];
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star ' + starSizes[Math.floor(Math.random() * starSizes.length)];
                star.style.left = Math.random() * 100 + '%';
                star.style.top  = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                starsContainer.appendChild(star);
            }
            const particleTypes = ['particle-small', 'particle-medium', 'particle-large'];
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle ' + particleTypes[Math.floor(Math.random() * particleTypes.length)];
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                if (p.classList.contains('particle-small'))      p.style.animationDuration = (Math.random() * 4 + 10) + 's';
                else if (p.classList.contains('particle-medium')) p.style.animationDuration = (Math.random() * 5 + 13) + 's';
                else                                              p.style.animationDuration = (Math.random() * 6 + 16) + 's';
                document.body.appendChild(p);
            }
        })();

        /* ---------- supabase ---------- */
        const SUPABASE_URL      = "https://rkrpnzkduomwxpyvcmdk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Pd7eGgZlfqb3ZrTM0BFE2Q_9JHGa6Hr";
        const SESSION_KEY = "fern_session_v1";

        async function rpc(fn, params) {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                    },
                    body: JSON.stringify(params || {}),
                });
                const text = await res.text();
                let data;
                try { data = JSON.parse(text); }
                catch { return { ok: false, error: "bad json: " + text.slice(0, 200) }; }
                if (res.status >= 400) {
                    const m = (data && (data.message || data.error)) || ("http " + res.status);
                    return { ok: false, error: m };
                }
                if (Array.isArray(data)) data = data[0] || {};
                if (typeof data !== "object" || data === null)
                    return { ok: false, error: "unexpected response" };
                return data;
            } catch (e) {
                return { ok: false, error: "network: " + e.message };
            }
        }

        /* ---------- session ---------- */
        function saveSession(s) { localStorage.setItem(SESSION_KEY, JSON.stringify({ ...s, at: Date.now() })); }
        function getSession() {
            try {
                const raw = localStorage.getItem(SESSION_KEY);
                if (!raw) return null;
                const s = JSON.parse(raw);
                if (Date.now() - s.at > 7 * 86400 * 1000) { localStorage.removeItem(SESSION_KEY); return null; }
                return s;
            } catch { return null; }
        }
        function clearSession() { localStorage.removeItem(SESSION_KEY); }

        /* ---------- helpers ---------- */
        // Treat input as email if it contains '@'. Otherwise it's a username.
        function isEmail(v) { return v.includes("@"); }

        /* ---------- auth ui ---------- */
        let authMode = "login";

        function setMode(mode) {
            authMode = mode;
            const isReg = mode === "register";
            document.getElementById("tabLogin").classList.toggle("active", !isReg);
            document.getElementById("tabRegister").classList.toggle("active", isReg);
            document.getElementById("ident").placeholder = isReg
                ? "username or email"
                : "username or email";
            document.getElementById("password").autocomplete = isReg ? "new-password" : "current-password";
            document.getElementById("authBtn").textContent = isReg ? "create account" : "enter";
            setMsg("");
        }

        function setMsg(text, isErr) {
            const m = document.getElementById("authMsg");
            m.textContent = text || "";
            m.className = "msg" + (text ? (isErr ? " err" : " ok") : "");
        }

        async function submitAuth(e) {
            e.preventDefault();
            const btn = document.getElementById("authBtn");
            btn.disabled = true;
            setMsg("contacting server…", false);

            const ident    = document.getElementById("ident").value.trim();
            const password = document.getElementById("password").value;

            if (!ident || !password) {
                setMsg("fill both fields", true);
                btn.disabled = false; return false;
            }

            /* ============ REGISTER ============ */
            if (authMode === "register") {
                let username, email;
                if (isEmail(ident)) {
                    // they typed an email → derive username from local part
                    email    = ident.toLowerCase();
                    username = email.split("@")[0];
                    // sanitize username a bit so it fits DB rules
                    username = username.replace(/[^a-z0-9._-]/g, "");
                    if (username.length < 3) {
                        setMsg("email prefix must be at least 3 chars", true);
                        btn.disabled = false; return false;
                    }
                } else {
                    // plain username → derive a placeholder email
                    username = ident.toLowerCase().replace(/[^a-z0-9._-]/g, "");
                    if (username.length < 3) {
                        setMsg("username must be at least 3 chars", true);
                        btn.disabled = false; return false;
                    }
                    email = username + "@fern.local";
                }

                const r = await rpc("fern_register", {
                    p_username: username,
                    p_email:    email,
                    p_password: password,
                });
                if (!r.ok) {
                    setMsg(r.error || "registration failed", true);
                    btn.disabled = false; return false;
                }

                // auto login after register (use username since that's what we stored)
                const lr = await rpc("fern_login", { p_username: username, p_password: password });
                if (!lr.ok) {
                    setMsg("account made — please log in manually", true);
                    btn.disabled = false;
                    setMode("login");
                    return false;
                }
                saveSession({ user_id: lr.user_id, username: lr.username });
                setMsg("success — loading…", false);
                await showDashboard();
                return false;
            }

            /* ============ LOGIN ============ */
            // Use whichever they typed; fern_login matches username OR email
            const lr = await rpc("fern_login", { p_username: ident, p_password: password });
            if (!lr.ok) {
                setMsg(lr.error || "login failed", true);
                btn.disabled = false; return false;
            }
            saveSession({ user_id: lr.user_id, username: lr.username });
            setMsg("success — loading…", false);
            await showDashboard();
            return false;
        }

        function logout() {
            clearSession();
            document.getElementById("dashScreen").classList.add("hidden");
            document.getElementById("authScreen").classList.remove("hidden");
            document.getElementById("authForm").reset();
            setMode("login");
            setMsg("");
        }

        /* ---------- dashboard ---------- */
        async function showDashboard() {
            const s = getSession();
            if (!s) { logout(); return; }

            document.getElementById("authScreen").classList.add("hidden");
            document.getElementById("dashScreen").classList.remove("hidden");
            document.getElementById("whoName").textContent = s.username;

            const stats = await rpc("fern_get_stats", { p_user_id: s.user_id });
            if (stats.ok) {
                document.getElementById("stSrv").textContent  = stats.servers_nuked ?? 0;
                document.getElementById("stDel").textContent  = stats.channels_del   ?? 0;
                document.getElementById("stMade").textContent = stats.channels_made  ?? 0;
                document.getElementById("stMsgs").textContent = stats.messages_sent  ?? 0;
                document.getElementById("stWh").textContent   = stats.webhooks_made  ?? 0;
                document.getElementById("stDm").textContent   = stats.members_dmed   ?? 0;
                document.getElementById("stUp").textContent   =
                    stats.updated_at ? String(stats.updated_at).slice(0, 19).replace("T", " ") : "—";
            }

            const hist = await rpc("fern_get_history", { p_user_id: s.user_id, p_limit: 50 });
            const body = document.getElementById("historyBody");
            body.innerHTML = "";

            if (!hist.ok) {
                body.innerHTML = `<tr><td colspan="4" class="empty">error: ${escapeHtml(hist.error || "unknown")}</td></tr>`;
                return;
            }
            const rows = Array.isArray(hist.rows) ? hist.rows : [];
            document.getElementById("stHist").textContent = rows.length;

            if (rows.length === 0) {
                body.innerHTML = `<tr><td colspan="4" class="empty">no history yet — run commands in the cli</td></tr>`;
                return;
            }

            for (const h of rows) {
                const ts = String(h.created_at || "").slice(0, 19).replace("T", " ");
                const actionClass = ["nuke", "pm"].includes(h.action) ? h.action : "";
                const details = h.details && Object.keys(h.details).length
                    ? escapeHtml(JSON.stringify(h.details)) : "—";
                body.insertAdjacentHTML("beforeend", `
                    <tr>
                        <td class="muted">${escapeHtml(ts)}</td>
                        <td><span class="tag ${actionClass}">${escapeHtml(h.action || "?")}</span></td>
                        <td>${escapeHtml(h.guild_name || "-")}</td>
                        <td class="muted">${details}</td>
                    </tr>
                `);
            }
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        /* ---------- bootstrap ---------- */
        (function init() {
            if (getSession()) showDashboard();
            else setMode("login");
        })();
    </script>
</body>
</html>
