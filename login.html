<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fern — Login</title>
<style>
  :root{
    --bg:#0a0713;--panel:#120d1e;--panel2:#1a1228;--border:#2a1f45;
    --text:#e8e0ff;--muted:#9b8fbf;--purple:#b06bff;--pink:#ff6bcb;
    --green:#5cff9d;--red:#ff6b6b;--cyan:#6bd6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(ellipse at top,#1a0f33 0%,#0a0713 60%);
    color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;
    min-height:100vh;display:grid;place-items:center;padding:20px;
  }
  .card{
    width:100%;max-width:420px;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--border);border-radius:20px;padding:32px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}
  .logo{
    width:52px;height:52px;border-radius:14px;
    background:linear-gradient(135deg,var(--purple),var(--pink));
    display:grid;place-items:center;font-weight:800;font-size:24px;
    box-shadow:0 8px 30px rgba(176,107,255,.5);
  }
  .brand h1{font-size:20px;letter-spacing:3px}
  .brand small{color:var(--muted);font-size:11px;letter-spacing:2px}
  h2{font-size:13px;letter-spacing:2px;color:var(--muted);
     text-transform:uppercase;margin-bottom:18px}
  .row{display:flex;justify-content:space-between;align-items:center;
       margin-bottom:18px}
  .link{color:var(--cyan);cursor:pointer;font-size:12px;text-decoration:none}
  .link:hover{text-decoration:underline}
  input{
    width:100%;padding:13px 14px;border-radius:11px;
    border:1px solid var(--border);background:#0e0a18;color:var(--text);
    font-size:14px;outline:none;transition:.15s;margin-bottom:10px;
  }
  input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(176,107,255,.15)}
  button{
    width:100%;padding:13px;border-radius:11px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--purple),var(--pink));
    color:white;font-weight:700;letter-spacing:1.5px;font-size:13px;
    margin-top:8px;transition:filter .15s,transform .1s;
  }
  button:hover:not(:disabled){filter:brightness(1.15)}
  button:active:not(:disabled){transform:scale(.98)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{margin-top:14px;font-size:13px;min-height:18px}
  .msg.err{color:var(--red)}
  .msg.ok{color:var(--green)}
  .hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo">F</div>
    <div>
      <h1>FERN</h1>
      <small>v{{ version }}</small>
    </div>
  </div>

  <div class="row">
    <h2 id="title">Login</h2>
    <a class="link" id="toggle" onclick="toggleMode()">create account</a>
  </div>

  <form id="form" onsubmit="submitForm(event)">
    <input id="username" placeholder="Username or email" autocomplete="username" required>
    <input id="email" placeholder="Email" type="email" autocomplete="email" class="hidden">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button id="btn" type="submit">LOGIN</button>
  </form>

  <div id="msg" class="msg"></div>
</div>

<script>
  let mode = 'login';

  function toggleMode() {
    mode = mode === 'login' ? 'register' : 'login';
    document.getElementById('title').textContent  = mode === 'login' ? 'Login' : 'Create Account';
    document.getElementById('btn').textContent    = mode === 'login' ? 'LOGIN' : 'CREATE ACCOUNT';
    document.getElementById('toggle').textContent = mode === 'login' ? 'create account' : 'back to login';
    document.getElementById('email').classList.toggle('hidden', mode === 'login');
    document.getElementById('password').autocomplete =
      mode === 'login' ? 'current-password' : 'new-password';
    setMsg('');
  }

  function setMsg(text, isErr) {
    const m = document.getElementById('msg');
    m.textContent = text || '';
    m.className = 'msg' + (text ? (isErr ? ' err' : ' ok') : '');
  }

  async function submitForm(e) {
    e.preventDefault();
    const btn = document.getElementById('btn');
    btn.disabled = true;
    setMsg('contacting server...', false);

    const body = {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
      email:    document.getElementById('email').value.trim(),
    };

    const endpoint = mode === 'login' ? '/api/login' : '/api/register';

    try {
      const r = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      let j;
      try { j = await r.json(); }
      catch { j = { ok: false, error: 'server returned ' + r.status }; }

      if (j.ok) {
        setMsg('success — redirecting...', false);
        window.location.href = '/dashboard';
      } else {
        setMsg(j.error || 'failed', true);
        btn.disabled = false;
      }
    } catch (err) {
      setMsg('network error: ' + err.message, true);
      btn.disabled = false;
    }
    return false;
  }
</script>
</body>
</html>
